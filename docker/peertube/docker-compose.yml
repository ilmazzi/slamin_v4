services:
  peertube:
    image: chocobozzz/peertube:production
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      PEERTUBE_WEBSERVER_HOSTNAME: localhost
      PEERTUBE_WEBSERVER_PORT: "9000"
      PEERTUBE_WEBSERVER_HTTPS: "false"
      PEERTUBE_SECRET: 8f3c1a9d2e7b64c0a5d18e4f7b2c9a016d3e8f1a2b4c6d8e0f1a3b5c7d9e0f12
      PEERTUBE_DB_USERNAME: peertube
      PEERTUBE_DB_PASSWORD: peertube
      PEERTUBE_DB_NAME: peertube
      PEERTUBE_DB_SSL: "false"
      PEERTUBE_DB_HOSTNAME: postgres
      PEERTUBE_REDIS_HOSTNAME: redis
      PEERTUBE_ADMIN_EMAIL: admin@localhost.local
      PEERTUBE_TRUST_PROXY: '["127.0.0.1", "loopback", "172.16.0.0/12"]'
      PT_INITIAL_ROOT_PASSWORD: slaminlocal
    volumes:
      - peertube-data:/data
      - peertube-config:/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: peertube
      POSTGRES_DB: peertube
    volumes:
      - peertube-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peertube -d peertube"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - peertube-redis:/data

volumes:
  peertube-data:
  peertube-config:
  peertube-db:
  peertube-redis:
